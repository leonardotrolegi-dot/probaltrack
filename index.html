/* LOGIN */
#login{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:radial-gradient(120% 70% at 50% 0%,var(--green-soft),transparent 70%),var(--bg)}
.lg-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand-ico{width:52px;height:52px;border-radius:14px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:30px;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.lg-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fld input,.fld select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px;min-width:0;width:100%}
.pin{letter-spacing:.5em}
.btn{height:44px;border-radius:10px;border:0;font-weight:600;padding:0 18px}
.btn-main{background:var(--ink);color:var(--lime);font-family:var(--f-disp);font-size:15px;letter-spacing:.02em}
.btn-main:hover{background:var(--ink-2)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.mini{height:32px;font-size:12px;padding:0 12px;border-radius:8px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
.demo{font-size:12px;color:var(--muted);text-align:center;margin:0}.demo b{color:var(--fg)}
.foot{font-size:11px;color:var(--muted);text-align:center}

/* SHELL */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ink);color:#e9ece9;padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.t-name{font-family:var(--f-disp);font-weight:700;font-size:18px;color:#fff;display:flex;align-items:center;gap:8px}
.t-sub{font-size:12px;color:#9aa39c}
.sp{flex:1}
.upd{display:flex;align-items:center;gap:8px;background:#000;border:1px solid #2c312d;border-radius:10px;padding:5px 10px}
.upd .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(196,239,90,.18)}
.upd span{font-size:11px;color:#9aa39c;line-height:1.2}.upd b{display:block;color:var(--lime);font-family:var(--f-disp);font-size:13px}
.chip-user{background:#000;border:1px solid #333;color:var(--lime);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;font-family:var(--f-disp)}
.out{background:transparent;border:1px solid #3a3f3b;color:#cfd5d0;border-radius:8px;height:32px;padding:0 10px;font-size:12px}
.mock-tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--lime);color:#111;border-radius:4px;padding:2px 6px;font-weight:700}
main{max-width:1200px;margin:0 auto;padding-block:14px 56px;display:flex;flex-direction:column;gap:14px;width:100%}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;font-size:14px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--green)}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.ctabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.ctabs button.on{background:var(--ink);color:var(--lime);border-color:var(--ink)}
.ctabs button small{font-weight:500;font-size:11px;opacity:.7}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.filters .fld{flex:1 1 130px}
.filters .fld input,.filters .fld select{height:38px;font-size:14px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;height:30px;padding:0 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--lime)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;height:38px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.fnote{flex-basis:100%;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.daychip{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600}
.dc-ok{background:var(--ok-soft);color:var(--ok)}.dc-part{background:var(--warn-soft);color:var(--warn)}.dc-none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k-l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .k-v{font-family:var(--f-disp);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.kpi .k-v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .k-d{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.hero .k-l,.kpi.hero .k-d,.kpi.hero .k-v small{color:#9aa39c}.kpi.hero .k-v{color:var(--lime)}
.kpi .est{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--warn);text-transform:uppercase}
.up{color:var(--ok)}.dn{color:var(--bad)}.wa{color:var(--warn)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:880px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h h3{font-size:16px}
.card-h .sub{color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.sw-c{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
svg text{fill:var(--muted);font-family:var(--f-body)}
.note{font-size:12px;color:var(--muted);margin:0}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.callout b{color:var(--warn)}
.callout.info{background:var(--info-soft)}.callout.info b{color:var(--info)}

/* barras horizontales */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:12px}
.bar-row .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:16px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.bar-goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.7}
.bar-zero{position:absolute;top:0;bottom:0;width:1px;background:var(--muted)}
.bar-row .bv{text-align:right;font-variant-numeric:tabular-nums}

/* tabla */
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
/* tablas sin barra: encabezados en 2 líneas en pantalla grande; en celular cada fila es una tarjeta */
th{white-space:normal;vertical-align:bottom;line-height:1.25;letter-spacing:.03em}
td.l{white-space:normal}
.tbl-wrap.tight table{font-size:12px}.tbl-wrap.tight th{font-size:10px;padding:6px 4px;letter-spacing:.02em}.tbl-wrap.tight td{padding:6px 4px}
.tbl-wrap.cards{overflow:visible;margin:0;padding:0}
.tbl-wrap.cards table,.tbl-wrap.cards tbody,.tbl-wrap.cards tfoot{display:block}
.tbl-wrap.cards thead{display:none}
.tbl-wrap.cards tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.tbl-wrap.cards tr.tot,.tbl-wrap.cards tfoot tr{background:var(--bg)}
.tbl-wrap.cards td{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;padding:0;white-space:normal;text-align:left;min-width:0;background:none!important;overflow-wrap:anywhere}
.tbl-wrap.cards td::before{content:attr(data-label);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;line-height:1.2}
.tbl-wrap.cards td:first-child{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.tbl-wrap.cards td:first-child::before,.tbl-wrap.cards td[data-label=""]::before{display:none}
.tbl-wrap.cards td:empty,.tbl-wrap.cards td[data-label=""]:empty{display:none}
.tbl-wrap.cards td[colspan]:not([colspan="1"]){grid-column:1/-1}
.tbl-wrap.cards td input,.tbl-wrap.cards td select{max-width:100%}
.tbl-wrap.cards td>div,.tbl-wrap.cards td>span:not(.pill):not(.tag){white-space:normal!important;flex-wrap:wrap;max-width:100%}
tbody tr:hover td{background:var(--green-soft)}
tr.tot td{font-weight:700;background:var(--bg);border-bottom:0}
.pq{font-family:var(--f-disp);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.p-ADAP{background:var(--info-soft);color:var(--d-ad)}.p-RECRIA{background:var(--warn-soft);color:var(--d-re)}.p-TERMINACION{background:var(--green-soft);color:var(--d-te)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-wa{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}
.tbl-in{width:84px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);text-align:right;padding:0 8px;font-variant-numeric:tabular-nums}
.tbl-in.d{width:132px;text-align:left}

/* tratos heat */
.heat{display:grid;gap:3px;font-size:11px}
.heat .hc{height:26px;border-radius:5px;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.heat .hh{color:var(--muted);font-weight:600;text-align:center;align-self:end;padding-bottom:2px}
.heat .hl{font-weight:600;align-self:center;white-space:nowrap}

/* gantt faena */
.gantt{display:flex;flex-direction:column;gap:6px}
.g-row{display:grid;grid-template-columns:86px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12px}
.g-track{position:relative;height:20px;background:var(--bg);border-radius:6px}
.g-bar{position:absolute;top:3px;bottom:3px;border-radius:4px;opacity:.9}
.g-done{position:absolute;top:3px;bottom:3px;border-radius:4px 0 0 4px;opacity:.35}
.g-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.g-axis{display:grid;grid-template-columns:86px minmax(0,1fr) 92px;gap:8px;font-size:11px;color:var(--muted)}
.g-axis div:nth-child(2){position:relative;height:16px}
.g-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* gestión */
.drop{border:2px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--bg);cursor:pointer}
.drop.hot{border-color:var(--green);background:var(--green-soft)}
.drop .ico{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.gthumb{width:76px;height:48px;padding:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff;flex:none}
.gthumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.gthumb:hover{border-color:var(--green)}
.gmodal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.gmodal figure{margin:0;max-width:1100px;width:100%;background:var(--card);border-radius:12px;overflow:hidden}
.gmodal img{width:100%;display:block}
.gmodal figcaption{padding:10px 14px;font-size:13px}
.rep{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border-bottom:0}
.rep .ck{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:13px}
.rep .ck.y{background:var(--ok-soft);color:var(--ok)}.rep .ck.n{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.rep .t{font-weight:600}.rep .m{font-size:12px;color:var(--muted)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}.li .t{font-weight:600}.li .m{color:var(--muted);font-size:12px;grid-column:1}.li .r{grid-row:1/span 2;grid-column:2;display:flex;gap:6px;align-items:center}
.swt{position:relative;width:40px;height:22px;border-radius:999px;background:var(--line);border:0;flex:none}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.swt.on{background:var(--green)}.swt.on::after{left:21px}
.qfill{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--bg);border-radius:12px;padding:10px}
.qfill .fld{flex:1 1 110px}.qfill .fld input,.qfill .fld select{height:36px;font-size:14px;background:var(--card)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--lime);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:20;max-width:90vw}
/* A PASTO */
.mseg{display:flex;background:#000;border:1px solid #2c312d;border-radius:10px;padding:3px;gap:2px}
.mseg button{border:0;background:transparent;color:#cfd5d0;border-radius:7px;height:28px;padding:0 10px;font-size:12.5px;font-weight:600}
.mseg button.on{background:var(--lime);color:#111}
.p-lib{display:flex;align-items:center;gap:8px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:600}
.p-mini{display:inline-block;width:46px;height:32px;border-radius:6px;overflow:hidden;vertical-align:middle;background:var(--bg)}
.p-mini img,.p-mini svg{width:100%;height:100%;object-fit:cover;display:block}
.p-pl{display:inline-grid;place-items:center;font-size:9px;color:var(--muted);border:1px dashed var(--line)}
.p-gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.p-gi{border:1px solid var(--line);background:var(--card);border-radius:10px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.p-gi:hover{border-color:var(--green)}
.p-im{aspect-ratio:4/3;max-width:100%;display:block;width:100%}
.p-im img,.p-im svg{width:100%;height:100%;object-fit:cover;display:block}
.p-cap{padding:6px 8px;font-size:11.5px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.callout.p-bad{background:var(--bad-soft)}.callout.p-bad b{color:var(--bad)}
.p-frame-grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.p-phone{background:var(--ink);border-radius:30px;padding:10px}
.p-phone>div{background:var(--bg);border-radius:22px;overflow:hidden;min-height:640px}
.p-app{display:flex;flex-direction:column;gap:10px;padding:12px}
.p-net{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:600;border-radius:10px;padding:8px 10px}
.p-net i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;margin-top:5px}
.p-net.on{background:var(--ok-soft);color:var(--ok)}.p-net.off{background:var(--bad-soft);color:var(--bad)}
.p-q{background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;border-radius:10px;padding:8px 10px}
.p-list{display:flex;flex-direction:column;gap:8px}
.p-rt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.p-ic{width:40px;height:40px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font:700 13px var(--f-disp);flex:none}
.p-rt.done .p-ic{background:var(--ok-soft);color:var(--ok)}
.p-r{margin-left:auto;text-align:right;font-size:12px;flex:none}
.p-back{background:none;border:0;color:var(--green);font-weight:600;padding:0;align-self:flex-start}
.p-plan{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;background:var(--green-soft);color:var(--green);border-radius:8px;padding:7px 10px;font-weight:600}
.p-photo{border:2px dashed var(--line);border-radius:12px;background:var(--card);min-height:150px;display:grid;place-items:center;overflow:hidden;position:relative}
.p-photo img,.p-photo svg{width:100%;height:210px;object-fit:cover;display:block}
.p-stamp{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px}
.p-file{position:relative;overflow:hidden;display:grid;place-items:center}
.p-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.p-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.p-opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 4px;font-size:12px;font-weight:600}
.p-opt svg{width:100%;height:30px;display:block;margin-bottom:4px;border-radius:5px}
.p-opt.on{border-color:var(--green);background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.p-kg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p-fld{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.p-fld label{font-size:11.5px;color:var(--muted)}
.p-stp{display:flex;align-items:center;gap:6px}
.p-stp button{width:36px;height:36px;border-radius:8px;border:0;background:var(--green-soft);color:var(--green);font-size:18px;font-weight:700;flex:none}
.p-stp input,.p-fld>input{width:100%;min-width:0;border:0;background:transparent;font:700 20px var(--f-disp);text-align:center;padding:2px 0}
.p-tot{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.p-tot b{font:700 22px var(--f-disp)}
@media (max-width:880px){.p-frame-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.p-gal{grid-template-columns:repeat(2,minmax(0,1fr))}.p-phone{padding:0;background:none}.p-phone>div{border:1px solid var(--line);border-radius:14px;min-height:0}}
@media (max-width:560px){.t-sub,.hide-sm{display:none}.kpi .k-v{font-size:22px}.bar-row,.g-row,.g-axis{grid-template-columns:70px minmax(0,1fr) 64px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* A PASTO · mapa y hacienda */
:root{--hc1:#2f6b43;--hc2:#86b04a;--hc3:#2f74a8;--hc4:#c98a1e;--hc5:#7a4fa3;--hc6:#b5543f;--hhalo:#ffffff;--hmap:#a9c48a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hc1:#57b07a;--hc2:#a6cf62;--hc3:#5ea3d6;--hc4:#e2a845;--hc5:#a57fd0;--hc6:#e07f69;--hhalo:#101310;--hmap:#3f5833}}
:root[data-theme="dark"]{--hc1:#57b07a;--hc2:#a6cf62;--hc3:#5ea3d6;--hc4:#e2a845;--hc5:#a57fd0;--hc6:#e07f69;--hhalo:#101310;--hmap:#3f5833}
.h-lay{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.h-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.h-file{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
.h-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.h-map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--hmap);touch-action:none}
.h-map svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.h-map.drawing svg{cursor:crosshair}
.h-hint{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--lime);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;max-width:calc(100% - 20px);pointer-events:none}
.h-pl{stroke:var(--hhalo);stroke-width:2.5;cursor:pointer}
.h-pl:hover{fill-opacity:.72}
.h-pl.on{stroke:var(--lime);stroke-width:4}
.h-lab{pointer-events:none;paint-order:stroke;stroke:var(--hhalo);stroke-width:4px;stroke-linejoin:round;fill:var(--fg);font-family:var(--f-body)}
.h-hd{fill:var(--lime);stroke:var(--ink);stroke-width:2;cursor:grab}
.h-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.h-list{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
.h-pi{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:7px 9px;font-size:13px;text-align:left;width:100%}
.h-pi.on{border-color:var(--green);background:var(--green-soft)}
.h-pi i{width:12px;height:12px;border-radius:3px;flex:none}
.h-pi .r{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.h-cbar{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.h-cbar .tr{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.h-cbar .tr i{display:block;height:100%;border-radius:5px}
.h-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.h-dl dt{color:var(--muted)}.h-dl dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.h-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.h-form .full{grid-column:1/-1}
.h-form label{font-size:11.5px;color:var(--muted);font-weight:600}
.h-form input,.h-form select{width:100%;min-width:0;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);padding:0 10px;font-size:14px}
.h-tseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.h-tseg button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;height:40px;font-weight:600;font-size:13px}
.h-tseg button.on{border-color:var(--green);background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.h-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.h-stack i{display:block;height:100%}
.h-tbl tr.sel td{background:var(--green-soft)}
.h-tbl tr.click{cursor:pointer}
.h-sel{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);padding:0 6px;font-size:13px}
.t-g{background:var(--bg);color:var(--muted)}.t-n2{background:var(--info-soft);color:var(--info)}
.h-chart text{fill:var(--muted);font-family:var(--f-body)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:980px){.h-lay{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.h-form{grid-template-columns:minmax(0,1fr)}.h-tseg{grid-template-columns:repeat(2,minmax(0,1fr))}.h-cbar{grid-template-columns:96px minmax(0,1fr) 40px}}
</style>

const REPORTS=[{k:"stock",n:"Inventario – Vista general",d:"CSV · stock y consumo diario por insumo"},{k:"grupos",n:"Grupos",d:"piquetes, ración, cabezas, MS programada"},{k:"consumo",n:"Consumo Materia Seca por cabeza",d:"CSV · kg entregados y MS por día"},{k:"carga",n:"Informe carga",d:"mezclas: ingredientes y tiempo de mezclador"},{k:"entrega",n:"Entrega de ración",d:"cada trato por piquete"},{k:"ing",n:"Uso ingrediente & premezcla",d:"consumo de insumos del período"},{k:"mov",n:"Movimientos de ganado",d:"CSV · llegadas, transferencias y ventas con cabezas y peso"}];
const DEF_G={ADAP:{dias:40,pin:300,gdp:1.0},RECRIA:{dias:20,pin:280,gdp:1.2},TERMINACION:{dias:75,pin:320,gdp:1.4}};
function buildClient(raw,meta){
  const cons=raw.cons.map(c=>({...c,f:toISO(c.f),dieta:c.rac.split("_")[0]}));
  const ent=[],ingL=[],mix=[];
  raw.loads.forEach((l,i)=>{const f=toISO(l.fecha),dieta=l.racion.split("_")[0];
    l.ent.forEach(e=>ent.push({...e,f:toISO(e.f),dieta}));
    l.ing.forEach(x=>ingL.push({...x,f,dieta,load:i}));
    if(l.ing.length) mix.push({f,dieta,load:i,h:l.ing[0].h,plan:l.mix?mmss(l.mix.plan):null,real:l.mix?mmss(l.mix.real):null,err:l.mix?l.mix.err:null,kg:l.ing.reduce((s,x)=>s+x.real,0)});
  });
  mix.sort((a,b)=>(a.f+a.h).localeCompare(b.f+b.h));
  // número de trato por grupo/día (orden horario) y estado de cada día
  const byGD={};ent.forEach(e=>{(byGD[e.g+"|"+e.f]=byGD[e.g+"|"+e.f]||[]).push(e)});
  Object.values(byGD).forEach(a=>a.sort((x,y)=>x.h.localeCompare(y.h)).forEach((e,i)=>e.n=i+1));
  const days={};Object.entries(byGD).forEach(([k,a])=>{const f=k.split("|")[1];days[f]=Math.max(days[f]||0,a.length)});
  cons.forEach(c=>{if(!days[c.f])days[c.f]=c.parc?1:TRATOS_DIA});
  const growth={};
  raw.grupos.forEach(g=>{const d=DEF_G[g.dieta]||DEF_G.RECRIA,s=(meta.growth||{})[g.g];growth[g.g]=s?{...s}:{ingreso:addDays(REF,-d.dias),pin:d.pin,gdp:d.gdp,faena:480,ex:true}});
  // dieta realmente entregada a cada piquete por día (Consumo + Entrega) → detecta cambios de dieta
  const dHist={};const hput=(g,f,d)=>{if(g&&f&&d)(dHist[g]=dHist[g]||{})[f]=d};
  cons.forEach(c=>hput(c.g,c.f,c.dieta));ent.forEach(e=>hput(e.g,e.f,e.dieta));
  const ds=Object.keys(days).sort();
  return {pasto:!!meta.pasto,pot:(meta.potreros||[]).map(p=>({...p,dias:[...(p.dias||[])]})),lotes:(meta.lotes||[]).map(l=>({...l})),cmap:{...(meta.cmap||{})},cmapAR:+meta.cmapAR||0,iprecio:{...(meta.iprecio||{})},cierreIn:{...(meta.cierreIn||{})},cierres:(meta.cierres||[]).map(r=>({...r})),psups:meta.psups||null,psupAlias:{...(meta.psupAlias||{})},psupHist:{...(meta.psupHist||{})},dprog:meta.dprog||null,movs:meta.movs||[],movFill:{...(meta.movFill||{})},movCab:{...(meta.movCab||{})},movAt:meta.movAt||"",haTot:+meta.haTot||0,mapAR:+meta.mapAR||0,pprog:meta.pprog||null,pprecio:{...(meta.pprecio||{})},dHist,gdpD:{...(meta.gdpD||{})},diasD:{...(meta.diasD||{})},id:meta.id,name:meta.name||"Cliente",short:meta.short||meta.name||"Cliente",user:meta.user||"",pin:meta.pin||"",updated:meta.updated||null,
    desde:raw.desde||ds[0]||REF,hasta:raw.hasta||ds[ds.length-1]||REF,grupos:raw.grupos.map(g=>{const o={...g,cab0:g.cab};if(movNewer(meta.movAt,meta)&&meta.movCab&&meta.movCab[g.g]!=null)o.cab=meta.movCab[g.g];return o}).sort((a,b)=>sortPq(a.g,b.g)),cons,ent,ingL,mix,days,growth,
    inv:meta.inv||null,stock:{...(meta.stock||{})},reports:REPORTS,got:meta.got||{},gotTs:{...(meta.gotTs||{})},round:meta.round||0,empty:!raw.grupos.length&&!cons.length};
}
/* fuente de cada cliente: meta + grupos + datos por día (así se guarda en Firebase) */
function rawToDays(raw){const by={},get=d=>by[d]=by[d]||{cons:[],loads:[]};
  (raw.cons||[]).forEach(c=>get(toISO(c.f)).cons.push(c));(raw.loads||[]).forEach(l=>get(toISO(l.fecha)).loads.push(l));return by}
function srcToRaw(src){const ds=Object.keys(src.byDay).sort(),raw={grupos:src.grupos||[],cons:[],loads:[]};
  ds.forEach(d=>{raw.cons.push(...(src.byDay[d].cons||[]));raw.loads.push(...(src.byDay[d].loads||[]))});return raw}
function rebuild(src){const C=buildClient(srcToRaw(src),src.meta);C.src=src;return C}
// mezcla un paquete nuevo: cada día que trae el paquete reemplaza al guardado (el más nuevo es el más completo)
function pickLoads(nw,cur){if(!nw.length)return cur;const hasIng=a=>a.some(l=>l.ing&&l.ing.length);
  if(!hasIng(nw)&&hasIng(cur))return cur; // una Entrega sola no pisa mezclas que ya tienen ingredientes
  // el tiempo de mezclador solo viene en el PDF: si la misma mezcla ya estaba, se conserva
  nw.forEach(l=>{if(l.mix)return;const m=cur.find(c=>c.mix&&c.racion===l.racion&&c.ing&&c.ing[0]&&l.ing[0]&&c.ing[0].h===l.ing[0].h);if(m)l.mix=m.mix});return nw}
function mergeInto(src,pkg){const nd=rawToDays(pkg),changed=[];
  Object.entries(nd).forEach(([d,v])=>{const cur=src.byDay[d]||{cons:[],loads:[]};src.byDay[d]={cons:v.cons.length?v.cons:cur.cons,loads:pickLoads(v.loads,cur.loads||[])};changed.push(d)});
  if(pkg.grupos&&pkg.grupos.length)src.grupos=pkg.grupos;return changed.sort()}

const emailOf=name=>slugName(name)+"@"+DOMAIN, pwOf=pin=>String(pin).trim()+"-capataz";

const loadScript=src=>new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
async function initFB(){
  if(!FB_CONFIG)return false;
  const v="https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(v+"firebase-app-compat.js");await loadScript(v+"firebase-auth-compat.js");await loadScript(v+"firebase-firestore-compat.js");
  firebase.initializeApp(FB_CONFIG);FB.auth=firebase.auth();FB.db=firebase.firestore();
  // caché local de Firestore: el tratador puede cargar sin señal y se envía al volver
  try{await FB.db.enablePersistence({synchronizeTabs:true})}catch(e){console.warn("sin caché offline",e.code)}
  FB.on=true;
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
  try{await FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
  return true;
}
async function fbLoadClient(cid){
  const ref=FB.db.collection("clients").doc(cid),[doc,days]=await Promise.all([ref.get(),ref.collection("days").get()]);
  if(!doc.exists)throw new Error("Cliente no encontrado");
  const m=doc.data(),byDay={};days.forEach(d=>byDay[d.id]=d.data());

    ${fut.length?`<tr class="tot"><td class="l">Total hasta la faena</td><td>${dShort(x.ingreso)}</td><td>${dShort(x.fecha)}</td><td>${fmt(P.dias+Fu.dias)}</td><td>${fmt((P.kg+aj+Fu.kg)/Math.max(1,P.dias+Fu.dias),2)}</td><td>${fmt(P.kg+aj+Fu.kg)}</td><td>${P.gs+Fu.gs?fmt(P.gs+Fu.gs):"—"}</td><td>${ck(P.gs+Fu.gs,P.kg+aj+Fu.kg)}</td></tr>`:""}
    </tbody></table></div>
    <p class="note" style="margin-top:8px">Días y dieta: los que dicen los informes (antes del primer informe, el programa del padrón). Kg ganados = días × GDP de esa dieta en el padrón: si cambiás la GDP o los días, este cuadro se recalcula desde el ingreso. Costo = suma, día por día, del costo por cabeza del piquete (MS consumida × costo del kg de MS de la ración); los días sin informe completo usan el costo medio del piquete (${avg?"Gs. "+fmt(avg)+"/cab/día":"sin dato"}) y lo previsto también.</p>`}
const cambioTag=x=>x&&x.cambios&&x.cambios.length?(c=>` <span class="tag t-wa" title="Cambio de dieta ${DIETA[c.de]||c.de} → ${DIETA[c.a]||c.a}: la GDP se ajustó sola">↻ ${DIETA[c.a]||c.a} ${dShort(c.f)}</span>`)(x.cambios[x.cambios.length-1]):"";

/* ---------- filtros ---------- */
const F={per:"3",desde:"",hasta:"",dieta:"",pq:"",full:true,sec:"res"};
function periodDays(C){
  const last=C.hasta;let a,b=last;
  if(F.per==="fx"){a=F.desde||C.desde;b=F.hasta||last}else{a=addDays(last,-(+F.per)+1)}
  const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out;}
const dayState=(C,d)=>!C.days[d]?"none":C.days[d]>=TRATOS_DIA?"ok":"part";
const dietSel=C=>F.dieta||(F.pq?(C.grupos.find(x=>x.g===F.pq)||{}).dieta:"")||"";
const inPq=(C,g)=>(!F.dieta||(C.grupos.find(x=>x.g===g)||{}).dieta===F.dieta)&&(!F.pq||F.pq===g);

/* ---------- render principal del cliente ---------- */
let CUR=null, MODE="cli";
function renderClient(host,C){dUse(C);

    <div class="fld" id="fxWrap" ${F.per==="fx"?"":"hidden"} style="flex:0 1 300px"><label>Desde / hasta</label><div style="display:flex;gap:6px"><input type="date" id="fDesde" value="${F.desde||C.desde}"><input type="date" id="fHasta" value="${F.hasta||C.hasta}"></div></div>
    <div class="fld"><label for="fDieta">Dieta</label><select id="fDieta"><option value="">Todas (media)</option>${DORDER.map(d=>`<option value="${d}" ${F.dieta===d?"selected":""}>${DIETA[d]}</option>`).join("")}</select></div>

function ctx(C){
  const days=periodDays(C), withData=days.filter(d=>C.days[d]);
  const consDays=withData.filter(d=>!F.full||dayState(C,d)==="ok");
  const grupos=C.grupos.filter(g=>inPq(C,g.g));
  $("#fNote").innerHTML=`<span>${dLong(days[0])} → ${dLong(days[days.length-1])} · ${withData.length} de ${days.length} días con datos:</span>`+
    days.filter(d=>days.length<=14||C.days[d]).map(d=>{const s=dayState(C,d);return `<span class="daychip dc-${s}">${dShort(d)} ${s==="ok"?"completo":s==="part"?`parcial ${C.days[d]}/${TRATOS_DIA} tratos`:"sin datos"}</span>`}).join("");
  return {days,withData,consDays,grupos,set:new Set(grupos.map(g=>g.g))};
}

function consAgg(C,X){ // por piquete: MS/cab media en días de consumo
  const r={};X.grupos.forEach(g=>{const rows=C.cons.filter(c=>c.g===g.g&&X.consDays.includes(c.f));
    const ms=rows.reduce((s,c)=>s+c.ms,0), cabD=rows.reduce((s,c)=>s+c.cab,0), tc=rows.reduce((s,c)=>s+c.real,0);
    r[g.g]={dmi:cabD?ms/cabD:NaN,tc:cabD?tc/cabD:NaN,ms,cabD,prog:g.ms,n:rows.length}});
  return r;}
function tratAgg(C,X,key){const rows=C.ent.filter(e=>X.set.has(e.g)&&X.days.includes(e.f));
  const by={};rows.forEach(e=>{const k=key(e);(by[k]=by[k]||[]).push(e)});
  const stat=a=>({n:a.length,ok:a.filter(e=>Math.abs(e.pct)<=5).length,mad:a.reduce((s,e)=>s+Math.abs(e.pct),0)/(a.length||1),kg:a.reduce((s,e)=>s+e.dev,0),plan:a.reduce((s,e)=>s+e.plan,0),real:a.reduce((s,e)=>s+e.real,0)});
  const out={};Object.entries(by).forEach(([k,a])=>out[k]=stat(a));out.__all=stat(rows);return out;}
// % PV por dieta: verde ≥ meta, amarillo entre el piso y la meta, rojo < piso
const PV_LIM={RECRIA:[2.1,1.5],ADAP:[2.4,2.0],TERMINACION:[2.3,1.8]};
const pvCell=(dmi,peso,dieta)=>{const v=dmi/peso*100,[ok,lo]=PV_LIM[dieta]||[1.8,1.4];return isFinite(v)&&peso>0?`<span class="tag ${v>=ok?"t-ok":v>=lo?"t-wa":"t-bad"}" title="${DIETA[dieta]||""}: verde ≥${fmt(ok,1)}% · amarillo ${fmt(lo,1)}–${fmt(ok,1)}% · rojo <${fmt(lo,1)}%">${fmt(v,2)}%</span>`:"—"};
const wavg=(vals)=>{let s=0,w=0;vals.forEach(([v,p])=>{if(isFinite(v)){s+=v*p;w+=p}});return w?s/w:NaN};

function kpi(l,v,u,d,cls="",extra=""){return `<div class="kpi ${cls}"><span class="k-l">${l}</span><span class="k-v num">${v}${u?`<small>${u}</small>`:""}</span><span class="k-d">${d}</span>${extra}</div>`}

function drawSec(C){
  const X=ctx(C), el=$("#sec");
  ({res:secRes,con:secCon,tra:secTra,car:secCar,cre:secCre,map:secMapa,mvg:secMov,inv:secInv,cie:secCie})[F.sec](C,X,el);
}

/* ---- RESUMEN ---- */
function secRes(C,X,el){
  const ca=consAgg(C,X), ta=tratAgg(C,X,e=>e.g), cab=X.grupos.reduce((s,g)=>s+g.cab,0), cst=costAgg(C,X);

  const next=X.grupos.filter(g=>g.g!=="Enfermeria").map(g=>({g:g.g,...growCalc(C,g.g)})).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];

    ${kpi("MS por cabeza / día",fmt(dmi,2),"kg",`programado ${fmt(prog,2)} kg · ${isFinite(dmi)?fmt(dmi/prog*100,0)+"%":"—"}`,"hero")}
    ${kpi("Costo diario",cst.cab&&cst.gs?fmt(cst.gs/cst.cab):"—",cst.cab&&cst.gs?"Gs./cab":"",!cst.cab&&!cst.gs&&!X.consDays.length?"sin días completos en el período":cst.cab&&cst.gs?`${fmt(cst.ms/cst.cab,2)} kg MS × ${fmt(cst.gs/cst.ms)} Gs./kg MS${cst.miss>0.02?` · ${fmt(cst.miss*100)}% de la MS sin precio`:""}`:"faltan precios de insumos (Inventario)")}
    ${kpi("Consumo % peso vivo",fmt(dmi/pHoy*100,2),"%","peso est. "+fmt(pHoy)+" kg","",'<span class="est">estimado</span>')}

  </div>
  <div class="card"><div class="card-h"><h3>Piquetes</h3><span class="sub">consumo de días completos · tratos y crecimiento del período</span></div>

  ${X.grupos.map(g=>{const c=ca[g.g],t=ta[g.g]||{n:0,ok:0,mad:0},gr=growCalc(C,g.g),pc=c.dmi/g.ms*100;
    return `<tr><td class="l pq">${pqName(g.g)}</td><td class="l">${dPill(g.dieta)}</td><td class="l">${dCambio(gr)}</td><td>${g.cab}</td><td>${gr.dias}</td><td>${fmt(gr.pin)}</td><td>${fmt(gr.hoy)}</td><td><b>${isFinite(c.dmi)?fmt(c.dmi,2):"—"}</b></td>${`<td>${(h=>h?`<span title="${dShort(h.f)} · ${fmt(h.ms,2)} kg MS × ${fmt(h.k)} Gs./kg MS">${fmt(h.gs)}</span>`:"—")(costHoy(C,X,g.g))}</td>`}<td>${pvCell(c.dmi,gr.hoy,g.dieta)}</td><td>${isFinite(pc)?`<span class="tag ${pc>=97&&pc<=105?"t-ok":pc>=92?"t-wa":"t-bad"}">${fmt(pc,0)}%</span>`:"—"}</td><td>${t.n?fmt(t.ok/t.n*100,0)+"%":"—"}</td><td>${t.n?`<span class="tag ${devCls(t.mad)}">${fmt(t.mad,1)}%</span>`:"—"}</td><td>${g.g==="Enfermeria"?"—":dShort(gr.fecha)}</td></tr>`}).join("")}

}

/* ---- CONSUMO ---- */
function secCon(C,X,el){

    prog:wavg(X.grupos.filter(g=>g.dieta===d).map(g=>[g.ms,g.cab]))})).filter(s=>s.v.some(isFinite));

      ${groupBars(daysD,series,C)}
      <p class="note">Los días parciales muestran poco consumo porque no se dieron los ${TRATOS_DIA} tratos (ej. 18/11 arrancó a la tarde y 20/11 está en curso).</p></div>

      <div class="bars">${X.grupos.map(g=>{const v=ca[g.g].dmi,pc=v/g.ms*100;return `<div class="bar-row"><span class="bn">${pqName(g.g)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v||0)/mx*100}%;background:${DCOL[g.dieta]}"></div><div class="bar-goal" style="left:${g.ms/mx*100}%"></div></div><span class="bv">${isFinite(v)?fmt(v,2):"—"} <span class="${pc<95?"dn":pc>105?"wa":"up"}">${isFinite(pc)?fmt(pc,0)+"%":""}</span></span></div>`}).join("")}</div></div>
  </div>
  <div class="card"><div class="card-h"><h3>Consumo por piquete y día</h3><span class="sub">kg MS/cab (kg tal cual entregados)</span></div>
  <div class="tbl-wrap"><table><thead><tr><th class="l">Piquete</th><th class="l">Dieta</th><th>Prog. MS</th>${daysD.map(d=>`<th>${dShort(d)}${dayState(C,d)!=="ok"?" ·p":""}</th>`).join("")}<th>Media</th><th>Peso hoy*</th><th>% PV*</th></tr></thead><tbody>
  ${X.grupos.map(g=>`<tr><td class="l pq">${pqName(g.g)}</td><td class="l"><span class="pill p-${g.dieta}">${DIETA[g.dieta]}</span></td><td>${fmt(g.ms,2)}</td>${daysD.map(d=>{const c=C.cons.find(x=>x.g===g.g&&x.f===d);const part=dayState(C,d)!=="ok";return `<td style="${part?"color:var(--muted)":""}">${c?`${fmt(c.dmi,2)} <span class="muted" style="font-size:11px">(${fmt(c.real)})</span>`:"—"}</td>`}).join("")}<td><b>${isFinite(ca[g.g].dmi)?fmt(ca[g.g].dmi,2):"—"}</b></td><td>${fmt(growCalc(C,g.g).hoy)}</td><td>${pvCell(ca[g.g].dmi,growCalc(C,g.g).hoy,g.dieta)}</td></tr>`).join("")}
  </tbody></table></div><p class="note">·p = día parcial (menos de ${TRATOS_DIA} tratos). La media ${F.full?"no incluye":"incluye"} días parciales. * % PV = MS kg/cab ÷ peso estimado hoy (peso entrada + GDP × días confinados). Colores por dieta: Recría verde ≥2,1% · rojo <1,5% | Adaptación verde ≥2,4% · rojo <2,0% | Terminación verde ≥2,3% · rojo <1,8% (amarillo en el medio).</p></div>`;
}
function groupBars(days,series,C){
  const W=560,H=220,L=34,R=8,T=12,B=26, all=series.flatMap(s=>[...s.v.filter(isFinite),s.prog]);
  const hi=Math.ceil(Math.max(...all,1)*1.1), y=v=>T+(hi-v)*(H-T-B)/hi, gw=(W-L-R)/Math.max(days.length,1), bw=Math.min(34,(gw-16)/Math.max(series.length,1));
  let g="";for(let v=0;v<=hi;v+=hi>12?4:2)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end">${v}</text>`;
  days.forEach((d,i)=>{const x0=L+i*gw+(gw-bw*series.length)/2, part=dayState(C,d)!=="ok";
    series.forEach((s,j)=>{const v=s.v[i];if(!isFinite(v))return;const x=x0+j*bw;
      g+=`<rect x="${x+2}" y="${y(v)}" width="${bw-4}" height="${y(0)-y(v)}" rx="3" fill="${DCOL[s.d]}" opacity="${part?.35:1}"/><text x="${x+bw/2}" y="${y(v)-4}" font-size="10" text-anchor="middle" style="fill:var(--fg)">${fmt(v,1)}</text>`;
      g+=`<line x1="${x+1}" x2="${x+bw-1}" y1="${y(s.prog)}" y2="${y(s.prog)}" stroke="var(--fg)" stroke-width="2" stroke-dasharray="3 2"/>`});
    g+=`<text x="${L+i*gw+gw/2}" y="${H-8}" font-size="11" text-anchor="middle">${dShort(d)}${part?" (parcial)":""}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Consumo de MS por día y dieta">${g}</svg>`;
}

/* ---- TRATOS ---- */
function secTra(C,X,el){

/* ========== Costo de alimentación y Cierre de animales (v0.040) ==========

  const pq={},all={gs:0,cab:0},okD=new Set((C.cons||[]).map(c=>c.f).filter(d=>dayState(C,d)==="ok")),useAll=!okD.size;(C.cons||[]).forEach(c=>{if(!useAll&&!okD.has(c.f))return;const k=ckOf0(by,dt,c.dieta,c.f);if(!c.cab||!k)return;const gs=c.ms*k.k,o=pq[c.g]=pq[c.g]||{gs:0,cab:0};o.gs+=gs;o.cab+=c.cab;all.gs+=gs;all.cab+=c.cab});

/* tarjeta de precios de insumos (Inventario) */
function iprCard(C){if(MODE!=="mgr")return "";const names=[...new Set([...(C.inv?C.inv.rows.map(r=>r.n):[]),...(C.ingL||[]).map(i=>i.n)])].filter(n=>n&&!isAgua(n)).sort();

  return `<div class="card"><div class="card-h"><h3>Precio de los insumos</h3><span class="sub">del informe de Inventario del sistema${C.inv&&C.inv.gen?" · "+escH(C.inv.gen):""} · Gs. por kg tal cual</span></div>

    <p class="note" style="margin-top:8px">Cada vez que subís el CSV se recalcula desde el historial: los piquetes con movimientos toman la fecha y el peso de <b>llegada</b> de sus animales (media ponderada por cabezas). El peso de una transferencia queda como «último pesaje». Los piquetes <b>fijados</b> no se tocan: corregí su fecha y peso de entrada en la tabla de arriba. Para que todo salga de la llegada real, subí el CSV con el historial completo de cada lote.</p>${MODE!=="cli"?`<div style="margin-top:10px"><button class="btn btn-ghost mini" id="movRecalc" type="button">Recalcular con los movimientos</button></div>`:""}</div>`}

function mgrCre(C,body){
  if(!C.grupos.length){body.innerHTML=`<div class="card empty"><h3>Sin piquetes todavía</h3><p class="note">Subí el informe “Grupos” (o el paquete) para que aparezcan los piquetes de ${C.short}.</p></div>`;return}
  const otros=Object.keys(CLIENTS).filter(k=>k!==C.id);
  dUse(C,true);const PD=dProgOf(C),extraD=[...dSeen(C)].filter(d=>!PD.some(x=>x.d===d)),pillSt=d=>DCOL0[d]?"":`background:var(--bg);color:${DCOL[d]};box-shadow:inset 0 0 0 1px ${DCOL[d]}`;
  body.innerHTML=`<div class="card"><div class="card-h"><h3>Padrón de ganancia por dieta</h3><span class="sub">GDP kg/día según la dieta que recibe cada piquete · el orden es el programa</span>${C._dDirty?'<span class="tag t-wa">cambios sin guardar</span>':""}</div>
    <div class="tbl-wrap"><table><thead><tr><th class="l">Orden</th><th class="l">Dieta</th><th>GDP kg/día</th><th>Días en la dieta</th><th></th></tr></thead><tbody>
    ${PD.map((x,i)=>{const d=x.d;return `<tr><td class="l">${i+1}º</td><td class="l"><span class="pill p-${d}" style="${pillSt(d)}">${escH(DIETA[d]||x.n)}</span> <span class="muted" style="font-size:11px">${escH(d)}</span></td>
      <td><input class="tbl-in" id="pd_${d}" data-pd="${d}" type="number" step="0.05" inputmode="decimal" placeholder="sin padrón" aria-label="GDP ${escH(x.n)}" value="${C.gdpD&&C.gdpD[d]!=null?C.gdpD[d]:""}"></td>
      <td>${i<PD.length-1?`<input class="tbl-in" data-pdd="${d}" type="number" step="1" inputmode="numeric" placeholder="días" aria-label="Días ${escH(x.n)}" value="${C.diasD&&C.diasD[d]!=null?C.diasD[d]:""}">`:'<span class="muted">hasta el peso de faena</span>'}</td>
      <td><div style="display:flex;gap:4px;justify-content:flex-end"><button class="btn btn-ghost mini" data-dup="${i}" type="button" ${i?"":"disabled"} aria-label="Subir ${escH(x.n)}" title="Subir">↑</button><button class="btn btn-ghost mini" data-ddn="${i}" type="button" ${i<PD.length-1?"":"disabled"} aria-label="Bajar ${escH(x.n)}" title="Bajar">↓</button><button class="btn btn-ghost mini" data-drm="${i}" type="button" ${PD.length>1?"":"disabled"} title="Quitar del programa">Quitar</button></div></td></tr>`}).join("")}
    </tbody></table></div>
    <div class="qfill" style="margin-top:10px"><div class="fld" style="flex:2 1 180px"><label for="ndN">Nueva dieta</label><input id="ndN" placeholder="ej. Pre-terminación"></div>
      <div class="fld" style="flex:1 1 150px"><label for="ndC">Código en el sistema</label><input id="ndC" list="ndL" placeholder="ej. PRETERM"><datalist id="ndL">${extraD.map(d=>`<option value="${escH(d)}">`).join("")}</datalist></div>
      <button class="btn btn-ghost mini" id="ndGo" style="height:36px" type="button">+ Agregar dieta</button><span class="sp"></span><button class="btn btn-ghost mini" id="pdGo" style="height:36px">Guardar padrón</button><button class="btn btn-main mini" id="pdApply" style="height:36px" type="button">${C._apAsk?`¿Quitar la GDP fija de ${C._apAsk} piquetes y aplicar?`:"Aplicar a la curva de crecimiento"}</button></div>
    ${extraD.length?`<p class="note" style="margin-top:6px">En los informes aparecen dietas que no están en el programa: <b>${extraD.map(escH).join(", ")}</b>. Agregalas con ese código para darles GDP y lugar en el orden.</p>`:""}
    <p class="note">Programa: ${PD.map(x=>escH(x.n)).join(" → ")}. El código es el comienzo del nombre de la ración en el sistema (lo que va antes del “_”): así Capataz reconoce la dieta en los informes. El peso de hoy suma la GDP de cada dieta por los días que el piquete estuvo en ella (los informes mandan; antes del primer informe se usa este programa). La faena se proyecta terminando los días que le quedan a la dieta actual y siguiendo el orden; la última dieta va hasta el peso de faena. Cuando Capataz detecta un cambio de dieta en los informes, recalcula solo.</p></div>
  ${otros.length?`<div class="card"><div class="qfill" style="margin:0"><div class="fld" style="flex:2 1 220px"><label for="cpFrom">Copiar curva de otro confinamiento</label><select id="cpFrom">${otros.map(k=>`<option value="${k}">${CLIENTS[k].name}</option>`).join("")}</select></div>
      <button class="btn btn-ghost mini" id="cpGo" style="height:36px">Copiar a ${C.short}</button></div>
    <p class="note">Copia el padrón por dieta y, para cada piquete con el mismo nombre, fecha de ingreso, peso entrada, GDP fija y peso faena.</p></div>`:""}
  <div class="card"><div class="card-h"><h3>Curva de crecimiento · ${C.short}</h3><span class="sub">datos que el sistema no trae · se usan en Crecimiento y faena</span></div>
    <div class="qfill"><div class="fld"><label for="qD">Aplicar a toda la dieta</label><select id="qD">${DORDER.map(d=>`<option value="${d}">${DIETA[d]}</option>`).join("")}</select></div>
      <div class="fld"><label for="qDias">Días confinados</label><input id="qDias" type="number" inputmode="numeric" placeholder="ej. 20"></div>
      <div class="fld"><label for="qPin">Peso entrada kg</label><input id="qPin" type="number" inputmode="decimal" placeholder="ej. 280"></div>
      <div class="fld"><label for="qFae">Peso faena kg</label><input id="qFae" type="number" inputmode="decimal" placeholder="ej. 480"></div>
      <button class="btn btn-main mini" id="qGo" style="height:36px">Aplicar</button></div>
    <div class="tbl-wrap"><table><thead><tr><th class="l">Piquete</th><th class="l">Dieta</th><th>Cab.</th><th class="l">Fecha ingreso</th><th>Días</th><th>Peso entrada</th><th>GDP actual</th><th>GDP fija</th><th>Peso faena</th><th>Peso hoy</th><th>Faena est.</th><th>Entrada</th></tr></thead><tbody id="gBody"></tbody></table></div>
    <p class="note">Los valores marcados “ej.” son de ejemplo hasta que los cambies. La fecha de ingreso fija los días: cada día que pasa suman solos. Los piquetes con <span class="tag t-ok" style="font-size:10.5px">mov.</span> toman ingreso y peso de los Movimientos de ganado: al subir un CSV nuevo se recalculan.</p></div>${movCard(C)}`;
  const save=async(msg)=>{try{await saveMeta(C);toast(msg)}catch(e){toast("Error al guardar: "+e.message)}};
  const draw=()=>{$("#gBody").innerHTML=C.grupos.map(g=>{const x=growCalc(C,g.g);return `<tr><td class="l pq">${pqName(g.g)}${x.ex?' <span class="muted" style="font-size:11px">ej.</span>':""}${C.growth[g.g]&&C.growth[g.g].fix?' <span class="tag t-n" style="font-size:10.5px">fijado</span>':C.growth[g.g]&&C.growth[g.g].mov?' <span class="tag t-ok" style="font-size:10.5px">mov.</span>':""}</td><td class="l"><span class="pill p-${g.dieta}">${DIETA[g.dieta]}</span>${cambioTag(x)}</td><td>${g.cab}</td>
      <td class="l"><input class="tbl-in d" type="date" data-g="${g.g}" data-f="ingreso" value="${x.ingreso}"></td><td>${x.dias}</td>
      <td><input class="tbl-in" type="number" data-g="${g.g}" data-f="pin" value="${x.pin}"></td><td>${fmt(x.gdp,2)}${x.auto?' <span class="muted" style="font-size:11px">auto</span>':""}</td><td><input class="tbl-in" type="number" step="0.05" data-g="${g.g}" data-f="gdpFix" value="${x.auto?"":x.gdpFix}" placeholder="auto" title="Vacío = usa el padrón de la dieta"></td><td><input class="tbl-in" type="number" data-g="${g.g}" data-f="faena" value="${x.faena}"></td>
      <td><b>${fmt(x.hoy)}</b>${(u=>u?`<br><span class="muted" style="font-size:11px" title="Peso del movimiento ${escH(u.lote)}">pesado ${fmt(u.w)} kg · ${dShort(u.f)}</span>`:"")((C.growth[g.g]||{}).ult)}</td><td>${g.g==="Enfermeria"?"—":dShort(x.fecha)}</td><td>${(C.growth[g.g]||{}).fix?`<button class="btn btn-ghost mini" data-gfix="${g.g}" type="button" title="Los movimientos vuelven a calcular este piquete">Soltar</button>`:`<button class="btn btn-main mini" data-gfix="${g.g}" type="button" title="Los movimientos no cambian la fecha ni el peso de entrada">Fijar</button>`}</td></tr>`}).join("");
    $$("#gBody input").forEach(i=>i.onchange=()=>{const o=C.growth[i.dataset.g];const f=i.dataset.f;o[f]=f==="ingreso"?i.value:f==="gdpFix"?(i.value===""?null:parseFloat(i.value)):parseFloat(i.value)||0;o.ex=false;if((f==="ingreso"||f==="pin")&&o.mov&&!o.fix){o.fix=true;toast(pqName(i.dataset.g)+" quedó fijado: los movimientos ya no cambian su entrada")}draw();save("Guardado · "+pqName(i.dataset.g))});
    $$("[data-gfix]").forEach(b=>b.onclick=()=>{const o=C.growth[b.dataset.gfix];o.fix=!o.fix;if(!o.fix&&C.movs&&C.movs.length){movCommit(C,movCalc(C))}draw();save(o.fix?`${pqName(b.dataset.gfix)} fijado: los movimientos no cambian su fecha ni su peso de entrada`:`${pqName(b.dataset.gfix)} suelto: se recalculó con los movimientos`)});
    const rc=$("#movRecalc");if(rc)rc.onclick=()=>{movCommit(C,movCalc(C));draw();save("Recalculado con los movimientos (los piquetes fijados no cambian)");renderMgr()};};
  draw();
  const cap=()=>{C.gdpD={...(C.gdpD||{})};C.diasD={...(C.diasD||{})};$$("[data-pd]").forEach(i=>{if(i.value!=="")C.gdpD[i.dataset.pd]=parseFloat(i.value);else delete C.gdpD[i.dataset.pd]});$$("[data-pdd]").forEach(i=>{if(i.value!=="")C.diasD[i.dataset.pdd]=parseInt(i.value,10);else delete C.diasD[i.dataset.pdd]})};
  const reP=P=>{cap();C.dprog=P;C._dDirty=true;DUSED=null;mgrCre(C,body)};
  $$("[data-dup]").forEach(b=>b.onclick=()=>{const P=dProgOf(C).slice(),i=+b.dataset.dup;[P[i-1],P[i]]=[P[i],P[i-1]];reP(P)});
  $$("[data-ddn]").forEach(b=>b.onclick=()=>{const P=dProgOf(C).slice(),i=+b.dataset.ddn;[P[i+1],P[i]]=[P[i],P[i+1]];reP(P)});
  $$("[data-drm]").forEach(b=>b.onclick=()=>{const P=dProgOf(C).slice();P.splice(+b.dataset.drm,1);reP(P)});
  $("#ndGo").onclick=()=>{const n=$("#ndN").value.trim(),c=dCode($("#ndC").value||n);if(!n&&!c){toast("Escribí el nombre de la dieta");return}
    if(dProgOf(C).some(x=>x.d===c)){toast("Esa dieta ya está en el programa");return}const P=dProgOf(C).slice(),last=P.pop();P.push({d:c,n:n||(c.charAt(0)+c.slice(1).toLowerCase())});if(last)P.push(last);reP(P);toast("Dieta agregada antes de la última: ordenala con las flechas y guardá")};
  $("#pdGo").onclick=()=>{cap();C.dprog=dProgOf(C).map(x=>({d:x.d,n:x.n}));delete C._dDirty;DUSED=null;dUse(C,true);mgrCre(C,body);save("Padrón por dieta guardado · curva recalculada")};
  /* aplicar: guarda el padrón y hace que todos los piquetes lo usen (saca la GDP fija si la hay), recalcula la curva de abajo */
  $("#pdApply").onclick=()=>{cap();const fx=C.grupos.filter(g=>{const o=C.growth[g.g];return o&&o.gdpFix!=null&&o.gdpFix!==""});
    if(fx.length&&!C._apAsk){C._apAsk=fx.length;mgrCre(C,body);return}
    fx.forEach(g=>{C.growth[g.g].gdpFix=null});delete C._apAsk;C.dprog=dProgOf(C).map(x=>({d:x.d,n:x.n}));delete C._dDirty;DUSED=null;dUse(C,true);mgrCre(C,body);
    save(`Padrón aplicado: ${C.grupos.length} piquetes recalculados${fx.length?` · ${fx.length} dejaron la GDP fija`:""}`);const gb=$("#gBody");if(gb)gb.scrollIntoView({block:"start",behavior:"smooth"})};
  if($("#cpGo"))$("#cpGo").onclick=()=>{const S=CLIENTS[$("#cpFrom").value];if(!S)return;let n=0;
    if(!confirm(`¿Copiar la curva de ${S.name} a ${C.name}? Se reemplazan los datos de los piquetes con el mismo nombre.`))return;
    C.gdpD={...(S.gdpD||{})};C.diasD={...(S.diasD||{})};C.dprog=S.dprog?JSON.parse(JSON.stringify(S.dprog)):null;DUSED=null;C.grupos.forEach(g=>{const s=S.growth[g.g];if(s&&!s.ex){C.growth[g.g]={...s};n++}});
    renderMgr();save(`Copiado de ${S.short}: padrón + ${n} piquetes`)};
  $("#qGo").onclick=()=>{const d=$("#qD").value,dias=$("#qDias").value,pin=$("#qPin").value,fae=$("#qFae").value;let n=0;
    C.grupos.filter(g=>g.dieta===d).forEach(g=>{const o=C.growth[g.g];if(dias!=="")o.ingreso=addDays(REF,-(+dias));if(pin!=="")o.pin=+pin;if(fae!=="")o.faena=+fae;o.ex=false;n++});draw();save(`Aplicado a ${n} piquetes de ${DIETA[d]}`)};
}
function mgrAcc(C,body){
  body.innerHTML=`<div class="grid2">
    <div class="card"><div class="card-h"><h3>Usuarios de ${C.short}</h3><span class="sub" id="accCount">cargando…</span></div>
      <div class="tbl-wrap"><table><thead><tr><th class="l">Usuario</th><th class="l">Acceso</th><th class="l">Contraseña</th><th class="l">Creado</th><th></th></tr></thead><tbody id="accBody"><tr><td class="l muted" colspan="5">Cargando…</td></tr></tbody></table></div>
      <p class="note">Cada usuario entra con su nombre y contraseña y ve solo los datos de ${C.short}. Acceso: qué módulos ve. «A pasto» solo aparece si el módulo está liberado para el cliente; un Tratador solo entra a la carga de tratos a pasto. Eliminar quita el acceso al instante.</p></div>

      <div class="card"><div class="card-h"><h3>Nuevo acceso</h3></div>
        <div class="fld"><label for="aUser">Usuario (nombre para entrar)</label><input id="aUser" placeholder="ej. Travis" autocomplete="off"></div>
        <div class="fld"><label for="aPin">Contraseña (4 a 8 números)</label><input id="aPin" inputmode="numeric" maxlength="8" placeholder="ej. 1234" autocomplete="off"></div>
        <div class="fld"><label for="aAcc">Acceso</label><select id="aAcc">${Object.entries(ACC).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
        <button class="btn btn-main" id="aNew">Crear acceso</button></div>
      <div class="card"><div class="card-h"><h3>Datos del cliente</h3></div>
        <div class="fld"><label for="aName">Nombre completo</label><input id="aName" value="${C.name}"></div>
        <div class="fld"><label for="aShort">Nombre corto (pestaña)</label><input id="aShort" value="${C.short}"></div>
        <button class="btn btn-ghost" id="aSave">Guardar</button></div>
    </div></div>`;
  let list=[];
  const dt=t=>t?new Date(t).toLocaleDateString("es-PY",{day:"2-digit",month:"2-digit",year:"2-digit"}):"—";
  const syncUser=async()=>{const n=list.map(a=>a.name).join(", ");if(C.user!==n){C.user=n;try{await saveMeta(C)}catch(e){}}};
  const draw=()=>{$("#accCount").textContent=list.length?list.length+" con acceso":"sin usuarios";
    $("#accBody").innerHTML=list.length?list.map((a,i)=>`<tr data-i="${i}"><td class="l pq">${a.name}</td>
      <td class="l"><select class="tbl-in d" style="width:210px" data-acc="${i}" aria-label="Acceso de ${a.name}">${Object.entries(ACC).map(([k,v])=>`<option value="${k}" ${(a.acc||"conf")===k?"selected":""}>${v}</option>`).join("")}</select></td>
      <td class="l">${a.pin?`<span class="num" data-pw="${i}" style="letter-spacing:.15em">••••</span> <button class="btn btn-ghost mini" data-see="${i}">Ver</button>`:`<span class="muted" style="font-size:12px">no registrada</span>`}</td>
      <td class="l muted">${dt(a.created)}</td>
      <td><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-ghost mini" data-ed="${i}">${a.pin?"Cambiar clave":"Registrar clave"}</button><button class="btn btn-ghost mini" data-del="${i}" style="color:var(--bad)">Eliminar</button></div></td></tr>`).join("")
      :`<tr><td class="l muted" colspan="5">Todavía no hay usuarios. Creá el primero a la derecha.</td></tr>`;
    $$("[data-acc]").forEach(s=>s.onchange=async()=>{const a=list[+s.dataset.acc];try{await setUser(a,{acc:s.value});a.acc=s.value;toast(`${a.name}: ${ACC[s.value]}`+(s.value!=="conf"&&!C.pasto?" · falta liberar A pasto para el cliente":""))}catch(e){toast("Error: "+errMsg(e))}});
    $$("[data-see]").forEach(b=>b.onclick=()=>{const i=+b.dataset.see,s=$(`[data-pw="${i}"]`),show=b.textContent==="Ver";s.textContent=show?list[i].pin:"••••";b.textContent=show?"Ocultar":"Ver"});
    $$("[data-del]").forEach(b=>b.onclick=async()=>{const a=list[+b.dataset.del];
      if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="¿Eliminar "+a.name+"?";b.style.background="var(--bad)";b.style.color="#fff";setTimeout(()=>{if(b.isConnected){b.dataset.ok="";b.textContent="Eliminar";b.style.background="";b.style.color="var(--bad)"}},4000);return}
      b.disabled=true;b.textContent="Eliminando…";try{await deleteAccess(a);list=list.filter(x=>x!==a);await syncUser();draw();toast("Acceso eliminado: "+a.name)}catch(e){toast("Error: "+errMsg(e));draw()}});
    $$("[data-ed]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ed,a=list[i],tr=b.closest("tr");if(tr.nextElementSibling&&tr.nextElementSibling.classList.contains("edrow")){tr.nextElementSibling.remove();return}
      const r=document.createElement("tr");r.className="edrow";
      r.innerHTML=`<td colspan="5" class="l" style="background:var(--bg)"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">

        <button class="btn btn-main mini" id="ns${i}" style="height:36px">Guardar</button></div></td>`;
      tr.after(r);$("#np"+i).focus();
      $("#ns"+i).onclick=async()=>{const v=$("#np"+i).value.trim();if(!v){toast("Escribí la clave");return}
        try{if(a.pin){await changePin(a,a.pin,v);toast("Clave cambiada · "+a.name)}else{await registerPin(a,v);toast("Clave registrada · "+a.name)}a.pin=v;draw()}catch(e){toast("Error: "+errMsg(e))}};});
  };
  listAccess(C).then(l=>{list=l;draw();syncUser()}).catch(e=>{$("#accBody").innerHTML=`<tr><td class="l" colspan="5" style="color:var(--bad)">No se pudo cargar la lista: ${errMsg(e)}</td></tr>`});
  $("#aSave").onclick=async()=>{C.name=$("#aName").value.trim()||C.name;C.short=$("#aShort").value.trim()||C.short;try{await saveMeta(C);toast("Guardado");renderMgr()}catch(e){toast("Error: "+e.message)}};
  $("#aNew").onclick=async()=>{const n=$("#aUser").value.trim(),p=$("#aPin").value.trim(),b=$("#aNew");if(!n||!p){toast("Completá usuario y contraseña");return}
    b.disabled=true;b.textContent="Creando…";

    catch(e){toast("Error: "+errMsg(e))}b.disabled=false;b.textContent="Crear acceso"};
}

/* ================= MÓDULO A PASTO ================= */
// potreros en meta.potreros; tratos en clients/{cid}/pasto/{id} (con miniatura); foto grande en clients/{cid}/fotos/{id}
const LECT=[{n:"Vacía",c:"t-bad"},{n:"Poco",c:"t-wa"},{n:"Con sobra",c:"t-ok"},{n:"Llena",c:"t-wa"}],LFILL=[.03,.25,.55,.9];
const WD=["D","L","M","M","J","V","S"],WDL=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const SUPS=["Proteinado","Energético-proteico","Sal mineral","Sal proteinada","Ración"];

function pStats(D,p,per){const from=addDays(REF,-(per-1)),all=D.tratos.filter(t=>t.pot===p.id).sort((a,b)=>(b.f+b.h).localeCompare(a.f+a.h));

// planilla estándar: fecha; potrero; kg (+ lectura, tratador opcionales)
function pPlanilla(C,txt){const L=txt.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());if(L.length<2)return {n:0,sin:[],rows:[]};
  const sep=[";","\t",","].find(s=>L[0].includes(s))||",",sp=l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,""));
  const H=sp(L[0]).map(h=>h.toLowerCase()),ix=re=>H.findIndex(h=>re.test(h));
  const iF=ix(/fecha/),iP=ix(/potrero|lote/),iK=ix(/kg|cantidad|kilos/),iL=ix(/lectura|batea|cocho/),iT=ix(/tratador|responsable/);
  if(iF<0||iP<0||iK<0)throw new Error("faltan las columnas fecha, potrero o kg");
  const norm=s=>slugName(s).replace(/\./g," ");const sin=new Set(),rows=[];let skip=0;
  L.slice(1).forEach(l=>{const c=sp(l),fs=c[iF]||"",m=fs.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/),m2=fs.match(/(\d{4})-(\d{2})-(\d{2})/);
    const f=m2?m2[0]:m?`${m[3].length===2?"20"+m[3]:m[3]}-${pad2(m[2])}-${pad2(m[1])}`:null,kg=parseFloat(String(c[iK]||"").replace(/\./g,"").replace(",","."))||parseFloat(c[iK]);
    if(!f||!(kg>0))return;const pn=norm(c[iP]||""),p=C.pot.find(x=>norm(x.n)===pn||norm(x.n).startsWith(pn+" ")||norm(x.lote)===pn);
    if(!p){if(c[iP])sin.add(c[iP]);return}
    if((C.tratos||[]).some(t=>t.pot===p.id&&t.f===f&&t.src!=="pl")){skip++;return}
    const lt=iL>=0?LECT.findIndex(x=>norm(x.n).slice(0,4)===norm(c[iL]||"").slice(0,4)):-1;
    rows.push({id:"pl_"+f+"_"+p.id,pot:p.id,f,h:"--:--",kg,lect:lt>=0?lt:2,tr:iT>=0?c[iT]||"":"",src:"pl",ts:Date.now()})});
  const ids=new Set(rows.map(r=>r.id));C.tratos=(C.tratos||[]).filter(t=>!ids.has(t.id)).concat(rows);
  return {n:rows.length,skip,sin:[...sin],rows}}

const hH=C=>C.hac||[],hMovs=C=>hH(C).filter(x=>x.k==="mov");
const hTot=o=>Object.values(o).reduce((a,b)=>a+b,0);
const hDom=o=>(Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||[])[0];
const hPot=(C,id)=>(C.pot||[]).find(p=>p.id===id);
const hName=(C,id)=>{const p=hPot(C,id);return p?p.n:(id||"—")};
const hShort=n=>String(n||"").replace(/^Potrero\s*/i,"P").replace(" · "," ");
const hHasMov=(C,id)=>hMovs(C).some(m=>m.pot===id||m.dest===id);
const hProgs=C=>C.pprog||HPROG0;
const hRow=(C,p,iso)=>{const P=p.prog&&hProgs(C)[p.prog];return P?P.rows[+iso.slice(5,7)-1]:null};
const hCons=(r,w)=>r.u==="pv"?(+r.v)/100*w*1000:+r.v;
const hGdp=(C,p,iso)=>{const r=hRow(C,p,iso);return r?+r.gdp:(+p.gdp||0)};
function hBase(C,p){if(hHasMov(C,p.id)){const ig=hIng(C,p.id);return ig&&ig.pin?{ing:ig.f,pin:ig.pin,cab:hTot(hStock(C,p.id))}:null}
  return p.ing&&+p.pin?{ing:p.ing,pin:+p.pin,cab:+p.cab||0}:null}
function hW(C,p,b,iso){let w=b.pin;for(let d=b.ing;d<iso;d=addDays(d,1))w+=hGdp(C,p,d);return w}
/* potrero "efectivo": cabezas de Movimientos y suplemento/objetivo/GDP de la curva */
function hProj(C,p){const b=hBase(C,p);if(!b||!b.cab)return null;let w=b.pin,d=b.ing;const pts=[[0,w]],cons=[],hoyI=Math.max(0,diffDays(REF,b.ing)),ps=+p.psal||380;let fecha=null,hoy=w;
  for(let i=0;i<1500;i++){const r=hRow(C,p,d)||{sup:p.sup,u:p.unit,v:+p.obj||0,gdp:+p.gdp||0};cons.push([i,hCons(r,w)]);if(i===hoyI)hoy=w;
    if(i>=hoyI&&w>=ps){fecha=d;break}w+=+r.gdp;d=addDays(d,1);pts.push([i+1,w])}
  fecha=fecha||d;return {p,ing:b.ing,pin:b.pin,pts,cons,hoyI,hoy,fecha,total:Math.max(1,diffDays(fecha,b.ing)),dRest:Math.max(0,diffDays(fecha,REF)),gdp:hGdp(C,p,REF),cab:b.cab,ps}}
const hPoly=p=>{const a=p.pg;if(!a||a.length<6)return null;const o=[];for(let i=0;i+1<a.length;i+=2)o.push([a[i],a[i+1]]);return o};
const hArea=poly=>{if(!poly)return 0;let a=0;poly.forEach(([x,y],i)=>{const [u,v]=poly[(i+1)%poly.length];a+=x*v-u*y});return Math.abs(a)/2};
const hMH=C=>Math.round(1000*(+C.mapAR||.64));
const hHa=(C,poly)=>+C.haTot>0?hArea(poly)/(1000*hMH(C))*C.haTot:0;
/* superficie: la cargada a mano manda; si no hay, se estima con el dibujo y la superficie total */
const hHaP=(C,p)=>+p.ha>0?+p.ha:hHa(C,hPoly(p));
/* carga animal en UA/ha: cabezas × peso estimado ÷ 450 kg ÷ ha */
function hCen(poly){let x=0,y=0,a=0;poly.forEach(([x0,y0],i)=>{const [x1,y1]=poly[(i+1)%poly.length],f=x0*y1-x1*y0;a+=f;x+=(x0+x1)*f;y+=(y0+y1)*f});
  if(Math.abs(a)<1)return poly.reduce((s,[px,py])=>[s[0]+px/poly.length,s[1]+py/poly.length],[0,0]);return [x/(3*a),y/(3*a)]}

function hFill(C,p){const st=hStock(C,p.id),c=hHasMov(C,p.id)?hTot(st):+p.cab||0;
  if(HS.color==="cat")return c?{f:hHasMov(C,p.id)?HCC[hDom(st)]:"var(--hc1)",o:.5}:{f:"var(--card)",o:.2};
  if(HS.color==="carga"){const u=hUA(C,p).uaha;return c?{f:"var(--hc1)",o:Math.min(.85,.15+u*.35)}:{f:"var(--card)",o:.2}}
  const x=hPotProj(C,p);if(!x)return {f:"var(--card)",o:.2};return {f:x.dRest<=60?"var(--hc6)":x.dRest<=120?"var(--hc4)":"var(--hc3)",o:.5}}
function hSVG(C){const W=1000,H=hMH(C);let s=`<svg id="hsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de la estancia con los potreros"><defs><pattern id="hHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" style="stroke:var(--hhalo)" stroke-width="3" opacity=".6"/></pattern>

  const P=(C.pot||[]).map(p=>({p,poly:hPoly(p)})).filter(x=>x.poly);
  P.forEach(({p,poly})=>{const {f,o}=hFill(C,p),pts=poly.map(q=>q.join(",")).join(" "),c=hHasMov(C,p.id)?hTot(hStock(C,p.id)):+p.cab||0;
    s+=`<polygon class="h-pl ${HS.sel===p.id?"on":""}" data-p="${p.id}" points="${pts}" style="fill:${f}" fill-opacity="${o}"/>`;
    if(!c)s+=`<polygon points="${pts}" fill="url(#hHatch)" pointer-events="none"/>`});
  P.forEach(({p,poly})=>{const [x,y]=hCen(poly),st=hStock(C,p.id),mv=hHasMov(C,p.id),c=mv?hTot(st):+p.cab||0,ha=hHaP(C,p),u=hUA(C,p);

    const ln4=[u.uaha?fmt(u.uaha,2)+" UA/ha":"",ha?fmt(ha)+" ha":""].filter(Boolean).join(" · ");

  if(HS.edit&&!HS.draw&&!HS.naming){const p=hPot(C,HS.sel),poly=p&&hPoly(p);if(poly)poly.forEach(([x,y],i)=>s+=`<circle class="h-hd" data-v="${i}" cx="${x}" cy="${y}" r="9"/>`)}
  if(HS.draw){const d=HS.draw;s+=`<polyline points="${[...d.pts,...(d.cur?[d.cur]:[])].map(q=>q.join(",")).join(" ")}" fill="none" style="stroke:var(--lime)" stroke-width="3" stroke-dasharray="7 5" pointer-events="none"/>`;
    d.pts.forEach(([x,y],i)=>s+=`<circle cx="${x}" cy="${y}" r="${i===0&&d.pts.length>2?11:6}" style="fill:${i===0?"var(--lime)":"var(--card)"};stroke:var(--ink)" stroke-width="2" pointer-events="none"/>`)}
  return s+"</svg>"}
function hMapa(host,C,mode){const mgr=mode==="mgr";

  $$("#hCol button",host).forEach(b=>b.onclick=()=>{HS.color=b.dataset.c;hMapa(host,C,mode)});

  const fi=$("#hImg",host);if(fi)fi.onchange=async()=>{const f=fi.files[0];if(!f)return;toast("Procesando imagen…");

  hMapEv(host,C,mode);hSide(host,C,mode)}
function hPt(e){const sv=$("#hsvg"),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse()),vb=sv.viewBox.baseVal;

function hSnap(C,q,skip){let best=null,bd=16;(C.pot||[]).forEach(p=>(hPoly(p)||[]).forEach((v,i)=>{if(skip&&skip.some(([pp,ii])=>pp===p&&ii===i))return;const d=Math.hypot(v[0]-q[0],v[1]-q[1]);if(d<bd){bd=d;best=v}}));return best?[...best]:q}

    if(HS.naming)return;
    const h=e.target.closest("[data-v]");
    if(h&&HS.edit&&mode==="mgr"){const p=hPot(C,HS.sel),poly=hPoly(p),[x0,y0]=poly[+h.dataset.v],grp=[];
      (C.pot||[]).forEach(pp=>(hPoly(pp)||[]).forEach((vv,ii)=>{if(Math.abs(vv[0]-x0)<1&&Math.abs(vv[1]-y0)<1)grp.push([pp,ii])}));
      HS.drag={grp};sv.setPointerCapture(e.pointerId);e.preventDefault();return}

function hSide(host,C,mode){const el=$("#hSide",host);if(!el)return;const mgr=mode==="mgr";
  if(HS.naming){const free=(C.pot||[]).filter(p=>!hPoly(p)),ha=hHa(C,HS.naming);
    el.innerHTML=`<div class="card"><div class="card-h"><h3>Nueva división</h3><span class="sub">${ha?fmt(ha)+" ha aprox.":""}</span></div>
      <div class="h-form" style="margin-top:10px"><div class="fld full"><label for="hnAs">Es el potrero</label><select id="hnAs">${free.map(p=>`<option value="${p.id}">${escH(p.n)} (sin dibujo)</option>`).join("")}<option value="">Potrero nuevo</option></select></div>

function hCosts(C,per){const from=addDays(REF,-(per-1)),T=C.tratos||[],H=hH(C);

/* ================= CRECIMIENTO Y FAENA ================= */
/* ========== A pasto: lotes (v0.032) — potreros fijos, lotes que se mueven ========== */
/* Un lote = nombre, categoría, ingreso, peso de ingreso, curva, peso de salida y destino (en meta.lotes).
   Sus cabezas y su potrero salen de los movimientos con campo «lote»: ent (+, fija potrero), sal/mue (−),
   tra sin nlote = mueve el lote entero (cambia potrero), tra con nlote = parte del lote pasa a un lote nuevo. */
const HL={sel:null,mv:null,mvTo:null,aj:null,nuevo:false,delPot:null};
const hLotes=C=>C.lotes||[];
const hLot=(C,id)=>hLotes(C).find(l=>l.id===id);
function lState(C,iso=REF){const S={},mk=id=>S[id]=S[id]||{cab:0,pot:null};
  hMovs(C).filter(m=>m.lote&&m.f<=iso).sort((a,b)=>a.f.localeCompare(b.f)||(a.ts||0)-(b.ts||0)).forEach(m=>{const s=mk(m.lote),c=+m.cab||0;
    if(m.t==="ent"){s.cab+=c;if(m.pot)s.pot=m.pot}else if(m.t==="sal"||m.t==="mue")s.cab-=c;
    else if(m.t==="tra"){if(m.nlote){s.cab-=c;const n=mk(m.nlote);n.cab+=c;n.pot=m.dest}else s.pot=m.dest}});
  return S}
const lCab=(C,id,iso=REF)=>Math.max(0,(lState(C,iso)[id]||{}).cab||0);
const lPotOf=(C,id,iso=REF)=>(lState(C,iso)[id]||{}).pot||null;
function lotsAt(C,pid,iso=REF){const S=lState(C,iso);return hLotes(C).filter(l=>S[l.id]&&S[l.id].pot===pid&&S[l.id].cab>0).map(l=>({l,cab:S[l.id].cab}))}
function lActive(C){const S=lState(C);return hLotes(C).filter(l=>S[l.id]&&S[l.id].cab>0).map(l=>({l,cab:S[l.id].cab,pot:S[l.id].pot}))}
const hHadLot=(C,pid)=>hMovs(C).some(m=>m.lote&&(m.pot===pid||m.dest===pid));
/* peso estimado del lote: peso de ingreso + GDP de la curva mes a mes */
function lW(C,l,iso=REF){let w=+l.pin||0;for(let d=l.ing;d<iso;d=addDays(d,1))w+=hGdp(C,l,d);return w}
/* UA = cabezas × peso estimado ÷ 450 kg */
const lUA=(C,l,cab,iso=REF)=>cab*lW(C,l,iso)/450;

/* stock por potrero y categoría: movimientos viejos (sin lote) + lotes que están en el potrero */
function hStock(C,id,iso=REF){const o={};hMovs(C).forEach(m=>{if(m.lote||m.f>iso)return;const c=+m.cab||0;
  if(m.t==="ent"&&m.pot===id)o[m.cat]=(o[m.cat]||0)+c;
  if((m.t==="sal"||m.t==="mue"||m.t==="tra")&&m.pot===id)o[m.cat]=(o[m.cat]||0)-c;
  if(m.t==="tra"&&m.dest===id)o[m.cat]=(o[m.cat]||0)+c});
  lotsAt(C,id,iso).forEach(({l,cab})=>o[l.cat]=(o[l.cat]||0)+cab);
  for(const k in o)if(o[k]<=0)delete o[k];return o}
function hIng(C,id){const e=hMovs(C).filter(m=>!m.lote&&((m.t==="ent"&&m.pot===id)||(m.t==="tra"&&m.dest===id))).sort((a,b)=>a.f.localeCompare(b.f));
  if(!e.length)return null;const f=e[0].f,c=e.filter(m=>m.f===f&&+m.peso>0),cab=c.reduce((a,m)=>a+(+m.cab||0),0);
  return {f,pin:cab?c.reduce((a,m)=>a+m.cab*m.peso,0)/cab:0}}
/* potrero "efectivo" para el panel y el tratador: suma de sus lotes (peso, GDP y objetivo ponderados por cabezas) */
function hEff(C,p){const q={...p},L=lotsAt(C,p.id);
  if(L.length){let cab=0,ws=0,gs=0,os=0;L.forEach(({l,cab:c})=>{const w=lW(C,l),r=hRow(C,l,REF)||{sup:p.sup,u:"g",v:0,gdp:0};cab+=c;ws+=w*c;gs+=(+r.gdp)*c;os+=hCons(r,w)*c});
    const big=L.slice().sort((a,b)=>b.cab-a.cab)[0].l,rb=hRow(C,big,REF);
    Object.assign(q,{cab,pin:ws/cab,ing:REF,gdp:gs/cab,unit:"g",obj:os/cab,sup:rb?rb.sup:(p.sup||""),lote:L.map(x=>x.l.n).join(" + "),cats:hStock(C,p.id),lotes:L,ua:L.reduce((a,x)=>a+lUA(C,x.l,x.cab),0)});return q}
  if(hHadLot(C,p.id)){Object.assign(q,{cab:0,lote:"",cats:{},lotes:[],ua:0});return q}
  if(hHasMov(C,p.id)){const st=hStock(C,p.id);q.cab=hTot(st);q.cats=st;const ig=hIng(C,p.id);if(ig){q.ing=ig.f;q.pin=ig.pin}}
  const r=hRow(C,p,REF);if(r){q.sup=r.sup;q.unit=r.u;q.obj=+r.v;q.gdp=+r.gdp;const b=hBase(C,p);if(b){q.pin=hW(C,p,b,REF);q.ing=REF}}
  q.ua=(+q.cab||0)*(q.cab?pPeso(q):0)/450;return q}
/* carga animal del potrero: UA de sus lotes ÷ ha */
function hUA(C,p){const e=hEff(C,p),c=+e.cab||0,ha=hHaP(C,p),ua=e.ua||0;return {cab:c,w:c?ua*450/c:0,ua,ha,uaha:ha&&ua?ua/ha:0}}
function lProj(C,l){const cab=lCab(C,l.id);if(!cab||!l.ing||!(+l.pin))return null;let w=+l.pin,d=l.ing;const pts=[[0,w]],cons=[],hoyI=Math.max(0,diffDays(REF,l.ing)),ps=+l.psal||380;let fecha=null,hoy=w;
  for(let i=0;i<1500;i++){const r=hRow(C,l,d)||{u:"g",v:0,gdp:0};cons.push([i,hCons(r,w)]);if(i===hoyI)hoy=w;if(i>=hoyI&&w>=ps){fecha=d;break}w+=+r.gdp;d=addDays(d,1);pts.push([i+1,w])}
  fecha=fecha||d;return {p:l,lot:true,ing:l.ing,pin:+l.pin,pts,cons,hoyI,hoy,fecha,total:Math.max(1,diffDays(fecha,l.ing)),dRest:Math.max(0,diffDays(fecha,REF)),gdp:hGdp(C,l,REF),cab,ps,pot:lPotOf(C,l.id)}}
function hPotProj(C,p){const L=lotsAt(C,p.id);if(L.length){const P=L.map(x=>lProj(C,x.l)).filter(Boolean);if(!P.length)return null;const cab=P.reduce((a,x)=>a+x.cab,0),e=P.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
    return {hoy:P.reduce((a,x)=>a+x.hoy*x.cab,0)/cab,fecha:e.fecha,dRest:e.dRest,dest:e.p.dest}}
  return hHadLot(C,p.id)?null:hProj(C,p)}
function hGain(C,p,d,cab){const L=lotsAt(C,p.id,d);return L.length?L.reduce((a,x)=>a+x.cab*hGdp(C,x.l,d),0):cab*hGdp(C,p,d)}

/* ---------- acciones sobre lotes (cada una deja su movimiento) ---------- */
const lId=()=>"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function lNew(C,o){const id=lId();(C.lotes=C.lotes||[]).push({id,n:o.n,cat:o.cat,ing:o.ing,pin:+o.pin||0,prog:o.prog||"mac",psal:+o.psal||380,dest:o.dest||"Confinamiento"});
  const m={k:"mov",f:o.ing,t:"ent",lote:id,pot:o.pot,cat:o.cat,cab:+o.cab,mot:o.mot||"Ingreso",by:"Gestión"};if(+o.pin)m.peso=+o.pin;hPut(C,m);hSaveMeta(C);return id}
function lMove(C,l,to,n,f){const s=lState(C,f)[l.id]||{cab:0,pot:null};
  if(n>=s.cab){hPut(C,{k:"mov",f,t:"tra",lote:l.id,pot:s.pot,dest:to,cat:l.cat,cab:s.cab,by:"Gestión"});return null}
  const id=lId();C.lotes.push({...l,id,n:l.n+" (parte)"});hSaveMeta(C);hPut(C,{k:"mov",f,t:"tra",lote:l.id,nlote:id,pot:s.pot,dest:to,cat:l.cat,cab:n,by:"Gestión"});return id}
function lAdj(C,l,t,n,f,mot,peso){const s=lState(C,f)[l.id]||{};const m={k:"mov",f,t,lote:l.id,pot:s.pot,cat:l.cat,cab:n,mot,by:"Gestión"};if(+peso)m.peso=+peso;hPut(C,m)}
const lOpts=(C,sel)=>lActive(C).map(({l,cab,pot})=>`<option value="${l.id}" ${l.id===sel?"selected":""}>${escH(l.n)} · ${escH(hShort(hName(C,pot)))} · ${fmt(cab)} cab</option>`).join("");
const hProgOpts=(C,sel)=>Object.entries(hProgs(C)).map(([k,o])=>`<option value="${k}" ${k===sel?"selected":""}>${escH(o.n)}</option>`).join("");

/* ================= POTREROS Y LOTES ================= */
function hPL(host,C){const pots=C.pot||[],act=lActive(C),S=lState(C);
  const legacy=pots.filter(p=>+p.cab>0&&!hHadLot(C,p.id)&&!hHasMov(C,p.id));
  const hasMap=pots.some(hPoly);
  const tot=act.reduce((a,x)=>a+x.cab,0),uaT=act.reduce((a,x)=>a+lUA(C,x.l,x.cab),0),haT=pots.reduce((a,p)=>a+hHaP(C,p),0);
  const mvL=HL.mv&&hLot(C,HL.mv),ajL=HL.aj&&hLot(C,HL.aj);
  host.innerHTML=`${legacy.length?`<div class="callout"><div><b>Datos de la versión anterior.</b> ${legacy.map(p=>`${escH(p.n)} tiene ${fmt(p.cab)} cab cargadas en el potrero`).join("; ")}. Convertilas en lote para que se puedan mover y ajustar.
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${legacy.map(p=>`<button class="btn btn-ghost mini" data-conv="${p.id}" type="button">Convertir ${escH(hShort(p.n))} en lote</button>`).join("")}</div></div></div>`:""}
  <div class="kpis">${kpi("Cabezas a pasto",fmt(tot),"",`${act.length} lotes en ${new Set(act.map(x=>x.pot)).size} potreros`,"hero")}${kpi("Unidades animales",fmt(uaT,1),"UA","cabezas × peso estimado ÷ 450 kg")}${kpi("Carga media",haT?fmt(uaT/haT,2):"—",haT?"UA/ha":"",haT?`${fmt(haT)} ha de potreros`:"falta la superficie")}${kpi("Potreros",fmt(pots.length),"",`${pots.filter(p=>lotsAt(C,p.id).length).length} con hacienda · ${pots.filter(p=>!lotsAt(C,p.id).length).length} en descanso`)}</div>
  ${hasMap?`<div class="card"><div class="card-h"><h3>Mapa</h3><span class="sub">los potreros quedan fijos; los lotes se mueven</span></div>
    <div class="h-map" style="margin-top:10px">${hLotSVG(C)}<div class="h-hint">${HL.sel&&hLot(C,HL.sel)?`Tocá el potrero de destino para ${escH(hLot(C,HL.sel).n)} (o el lote de nuevo para cancelar)`:"Tocá un lote para moverlo a otro potrero"}</div></div></div>`:""}
  <div class="card"><div class="card-h"><h3>Potreros</h3><span class="sub">fijos: nombre, superficie y dibujo en «Mapa» · se guardan al cambiar</span></div>
    <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th class="l">Potrero</th><th>Superficie (ha)</th><th class="l">Mapa</th><th class="l">Lote hoy</th><th>Cabezas</th><th>UA</th><th>UA/ha</th><th></th></tr></thead><tbody>
    ${pots.map(p=>{const L=lotsAt(C,p.id),cab=L.reduce((a,x)=>a+x.cab,0),ua=L.reduce((a,x)=>a+lUA(C,x.l,x.cab),0),ha=hHaP(C,p);
      return `<tr><td class="l"><input class="tbl-in" style="width:180px;text-align:left" data-pn="${p.id}" value="${escH(p.n)}" aria-label="Nombre del potrero"></td>
      <td><input class="tbl-in" style="width:84px" type="number" step="any" data-pha="${p.id}" value="${+p.ha||""}" placeholder="${hHa(C,hPoly(p))?fmt(hHa(C,hPoly(p))):"ha"}" aria-label="Superficie en hectáreas"></td>

function hCurve(C,x){const el=$("#hCurve");if(!el||!x)return;$("#hCvSub").textContent=`${x.p.n} · ${hProgs(C)[x.p.prog]?hProgs(C)[x.p.prog].n:"sin curva"}`;

function liveWatch(ids){liveStop();if(!FB.on)return;
  ids.forEach(cid=>LIVE.push(FB.db.collection("clients").doc(cid).onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;
    const m=s.data(),C=CLIENTS[cid];if(!C||!m.updTs||m.updTs===((C.src&&C.src.meta.updTs)||0))return;
    fbLoadClient(cid).then(N=>{const O=CLIENTS[cid];if(O&&O.user)N.user=O.user;CLIENTS[cid]=N;if(typeof ALLC!=="undefined"&&ALLC&&ALLC[cid])ALLC[cid]=N;
      const who=m.updBy?` por ${m.updBy}`:"",busy=document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
      if(MODE==="cli"){if(CMOD!=="trat"&&!busy)renderCli(N);if(CMOD!=="trat")toast(`Informes actualizados${who} · ${N.updated||""}`)}
      else if(MG.c===cid&&!busy){renderMgr();toast(`Informes actualizados${who} · ${N.updated||""}`)}

  if(!w.clientWidth)return;const over=()=>t.scrollWidth>w.clientWidth+4;
  w.classList.remove("cards","tight");if(!over())return;w.classList.add("tight");if(over()&&nar)w.classList.add("cards")})}
